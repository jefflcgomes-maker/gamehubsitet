<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/home.css">
</head>

<body>
  <header>
    <div class="menu-strip">
      <nav>
        <a href="index.html">Home</a>
        <a href="catalogo.html">Jogos</a>
        <a href="sobre.html">Sobre</a>

      </nav>
    </div>
  </header>

  <!-- Nome e tarja do home -->
  <div class="container">

    <section class="hero-banner full-bleed">
      <div class="hero-inner">
        <h1 class="hero-title">GameHub</h1>
        <p class="hero-subtitle">Descubra novos jogos indie e apoie novos desenvolvedores.</p>
      </div>
    </section>

    <!-- TARJA: NOVIDADES (full width) -->
    <section class="cards-strip full-bleed" id="novidades">
      <div class="cards-strip-inner">
        <div class="strip-head">
          <h2 class="cards-strip-title">NOVIDADES</h2>
          <div class="strip-actions">
            <button class="strip-btn" type="button" id="scrollLeft" aria-label="Rolar para esquerda">‹</button>
            <button class="strip-btn" type="button" id="scrollRight" aria-label="Rolar para direita">›</button>
          </div>
        </div>

        <div class="strip-cards" id="novidadesCards">
          <!-- Cards gerados via JS -->
        </div>
      </div>
    </section>

  </div>

  <footer>© 2026 GameHub Indie</footer>

  <!-- MENU + CONTROLE DE ACESSO -->
  <script type="module" src="js/menu-auth.js"></script>
  <script type="module" src="js/access.js"></script>

  <!-- NOVIDADES (galeria horizontal) -->
  <script src="js/novidades.js"></script>
</body>
</html>
