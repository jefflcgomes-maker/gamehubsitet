<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro | GameHub Indie</title>

  <link rel="stylesheet" href="../css/style.css" />

  <style>
    body.auth-page{
      min-height: 100vh;
      background: radial-gradient(900px 500px at 20% 10%, rgba(124,92,255,.22), transparent 60%),
                  radial-gradient(900px 500px at 80% 90%, rgba(76,175,80,.18), transparent 60%),
                  #0b0f17;
      color: #fff;
      overflow-x: hidden;
    }

    .neo-bg{
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image:
        linear-gradient(rgba(106,166,255,.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(106,166,255,.10) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1), rgba(0,0,0,.1) 60%, transparent 75%);
    }

    .auth-wrap{
      min-height: calc(100vh - 80px);
      display: grid;
      place-items: center;
      padding: 30px 16px 50px;
    }

    .auth-card{
      width: 100%;
      max-width: 520px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 22px 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      position: relative;
      overflow: hidden;
    }

    .auth-card:before{
      content:"";
      position:absolute;
      inset:-2px;
      background: linear-gradient(135deg, rgba(124,92,255,.35), rgba(76,175,80,.20), rgba(106,166,255,.20));
      opacity: .35;
      filter: blur(20px);
      z-index: 0;
    }
    .auth-card > *{ position: relative; z-index: 1; }

    .brand h1{ font-size: 18px; margin-bottom: 6px; }
    .brand p{ font-size: 13px; opacity:.86; line-height:1.4; margin-bottom: 14px; }

    .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 560px){ .grid2{ grid-template-columns: 1fr; } }

    .field{ display:block; margin-bottom: 12px; }
    .field span{ display:block; font-size: 12px; opacity:.85; margin-bottom: 6px; }
    .field input{
      width:100%;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.25);
      color:#fff;
      padding: 12px 12px;
      border-radius: 10px;
      outline:none;
    }
    .field input::placeholder{ color: rgba(255,255,255,.55); }

    .btn{
      width:100%;
      border:none;
      background: linear-gradient(90deg, #4caf50, #6aa6ff);
      color:#000;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight:bold;
      cursor:pointer;
    }

    .row{
      display:flex;
      justify-content: space-between;
      gap: 10px;
      align-items:center;
      font-size: 12px;
      opacity:.92;
      flex-wrap: wrap;
      margin: 8px 0 14px;
    }

    .link{ color:#6aa6ff; text-decoration:none; }
    .link:hover{ text-decoration: underline; }

    .error{ color:#ff6b6b; font-size: 12px; min-height: 16px; display:block; }
  </style>
</head>

<body class="auth-page">
  <div class="neo-bg"></div>

  <header>
    <h2>GameHub Indie</h2>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../catalogo.html">Jogos</a>
      <a href="../sobre.html">Sobre</a>
    </nav>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <div class="brand">
        <h1>Criar Conta</h1>
        <p>Cadastre-se para ter perfil de jogador, favoritos e progresso salvo.</p>
      </div>

      <form id="cadastroForm" autocomplete="on" novalidate>
        <div class="grid2">
          <label class="field">
            <span>Nome</span>
            <input id="nome" type="text" placeholder="Seu nome" autocomplete="given-name" />
            <small class="error" id="nomeError"></small>
          </label>

          <label class="field">
            <span>Nick</span>
            <input id="nick" type="text" placeholder="Seu nick" autocomplete="nickname" />
            <small class="error" id="nickError"></small>
          </label>
        </div>

        <label class="field">
          <span>Email</span>
          <input id="email" type="email" placeholder="seuemail@gmail.com" autocomplete="email" />
          <small class="error" id="emailError"></small>
        </label>

        <div class="grid2">
          <label class="field">
            <span>Senha</span>
            <input id="senha" type="password" placeholder="Crie uma senha" autocomplete="new-password" />
            <small class="error" id="senhaError"></small>
          </label>

          <label class="field">
            <span>Confirmar senha</span>
            <input id="confirmar" type="password" placeholder="Repita a senha" autocomplete="new-password" />
            <small class="error" id="confirmarError"></small>
          </label>
        </div>

        <div class="row">
          <span class="small" style="opacity:.85">Ao criar conta, você acessa a Área do Usuário.</span>
          <a class="link" href="./login.html">Já tenho conta</a>
        </div>

        <button class="btn" type="submit">Criar conta</button>
      </form>
    </section>
  </main>

  <script type="module">
    import { Auth } from "./auth.js";

    const form = document.getElementById("cadastroForm");
    const nome = document.getElementById("nome");
    const nick = document.getElementById("nick");
    const email = document.getElementById("email");
    const senha = document.getElementById("senha");
    const confirmar = document.getElementById("confirmar");

    const nomeError = document.getElementById("nomeError");
    const nickError = document.getElementById("nickError");
    const emailError = document.getElementById("emailError");
    const senhaError = document.getElementById("senhaError");
    const confirmarError = document.getElementById("confirmarError");

    function clearErrors(){
      nomeError.textContent = "";
      nickError.textContent = "";
      emailError.textContent = "";
      senhaError.textContent = "";
      confirmarError.textContent = "";
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      clearErrors();

      const n = nome.value.trim();
      const k = nick.value.trim();
      const em = email.value.trim();
      const pw = senha.value.trim();
      const pw2 = confirmar.value.trim();

      let ok = true;

      if (n.length < 2) { nomeError.textContent = "Nome inválido."; ok = false; }
      if (k.length < 3) { nickError.textContent = "Nick inválido (mín. 3)."; ok = false; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { emailError.textContent = "Email inválido."; ok = false; }
      if (pw.length < 4) { senhaError.textContent = "Senha inválida (mín. 4)."; ok = false; }
      if (pw2 !== pw) { confirmarError.textContent = "As senhas não coincidem."; ok = false; }

      if (!ok) return;

      const reg = Auth.register({ nome: n, nick: k, email: em, senha: pw });
      if (!reg.ok) {
        emailError.textContent = reg.message;
        return;
      }

      // login automático após cadastro
      Auth.login(em, pw);
      window.location.href = "./usuario.html";
    });
  </script>

  <!-- MENU + CONTROLE DE ACESSO -->
  <script type="module" src="/js/menu-auth.js"></script>
  <script type="module" src="/js/access.js"></script>
</body>
</html>
