<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virar DEV | GameHub Indie</title>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">

  <style>
    body.auth-page{
      min-height: 100vh;
      background: radial-gradient(900px 500px at 20% 10%, rgba(124,92,255,.22), transparent 60%),
                  radial-gradient(900px 500px at 80% 90%, rgba(76,175,80,.18), transparent 60%),
                  #0b0f17;
      color: #fff;
      overflow-x: hidden;
    }
    .neo-bg{
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image:
        linear-gradient(rgba(106,166,255,.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(106,166,255,.10) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1), rgba(0,0,0,.1) 60%, transparent 75%);
    }
    .wrap{
      min-height: calc(100vh - 80px);
      display: grid;
      place-items: center;
      padding: 30px 16px 50px;
    }
    .card{
      width: 100%;
      max-width: 620px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 22px 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    .brand h1{ font-size: 18px; margin-bottom: 6px; }
    .brand p{ font-size: 13px; opacity:.86; line-height:1.4; margin-bottom: 14px; }

    .field{ display:block; margin-bottom: 12px; }
    .field span{ display:block; font-size: 12px; opacity:.85; margin-bottom: 6px; }
    .field input, .field textarea, .field select{
      width:100%;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.25);
      color:#fff;
      padding: 12px;
      border-radius: 10px;
      outline:none;
    }
    .field textarea{ min-height: 110px; resize: vertical; }
    .row{ display:flex; gap: 12px; }
    @media (max-width: 560px){ .row{ flex-direction: column; } }

    .btn{
      width: 100%;
      border: none;
      background: linear-gradient(90deg, #4caf50, #6aa6ff);
      color: #000;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn.secondary{
      background: rgba(255,255,255,.10);
      color:#fff;
      border: 1px solid rgba(255,255,255,.18);
      margin-top: 10px;
    }
    .error{ color:#ff6b6b; font-size: 12px; min-height: 16px; }
    .muted{ margin-top: 10px; font-size: 13px; opacity:.85; }
    .link{ color:#6aa6ff; text-decoration:none; }
    .link:hover{ text-decoration: underline; }
  </style>
</head>

<body class="auth-page">
  <div class="neo-bg"></div>

  <header>
    <h2>GameHub Indie</h2>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../catalogo.html">Jogos</a>
      <a href="../sobre.html">Sobre</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="brand">
        <h1>Virar um Dev</h1>
        <p>Preencha o formulário. Seu pedido ficará como <strong>“Aguardando ser aceito”</strong> até aprovação manual do administrador.</p>
      </div>

      <form id="devForm" novalidate>
        <div class="row">
          <label class="field" style="flex:1;">
            <span>Nome (automático)</span>
            <input id="nome" type="text" disabled />
          </label>
          <label class="field" style="flex:1;">
            <span>Nick (automático)</span>
            <input id="nick" type="text" disabled />
          </label>
        </div>

        <label class="field">
          <span>Tipo</span>
          <select id="tipo">
            <option value="solo">Solo dev</option>
            <option value="studio">Estúdio</option>
          </select>
        </label>

        <label class="field">
          <span>Link do portfólio (Itch.io / GitHub / ArtStation / site)</span>
          <input id="portfolio" type="url" placeholder="https://..." />
        </label>

        <label class="field">
          <span>Por que você quer virar dev?</span>
          <textarea id="motivo" placeholder="Conte um pouco sobre seus projetos, experiência e o que pretende postar..."></textarea>
          <div class="error" id="err"></div>
        </label>

        <button class="btn" type="submit">Enviar pedido</button>
        <a class="btn secondary" href="./usuario.html" style="display:block; text-align:center; text-decoration:none;">Voltar para o perfil</a>

        <p class="muted">DEMO: o pedido fica salvo no navegador (localStorage).</p>
      </form>
    </section>
  </main>

  <script type="module">
    import { Auth } from "./auth.js";
    import { DevSystem } from "/js/dev-system.js";

    if (!Auth.isLoggedIn()) {
      window.location.href = "./login.html";
    }

    const user = Auth.getCurrentUser();
    if (!user) {
      Auth.logout();
      window.location.href = "./login.html";
    }

    // bloqueia se já pendente/aprovado
    if (user.devStatus === "pending") {
      alert("Seu pedido já está em análise.");
      window.location.href = "./usuario.html";
    }
    if (user.isDev === true || user.devStatus === "approved") {
      alert("Você já é DEV aprovado.");
      window.location.href = "./usuario.html";
    }

    // cooldown se rejeitado
    if (user.devStatus === "rejected" && user.devRejectedUntil) {
      const until = new Date(user.devRejectedUntil).getTime();
      if (Date.now() < until) {
        alert("Você foi recusado. Tente novamente após 7 dias.");
        window.location.href = "./usuario.html";
      }
    }

    document.getElementById("nome").value = user.nome || "";
    document.getElementById("nick").value = user.nick || "";

    const form = document.getElementById("devForm");
    const err = document.getElementById("err");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      err.textContent = "";

      const tipo = document.getElementById("tipo").value;
      const portfolio = document.getElementById("portfolio").value.trim();
      const motivo = document.getElementById("motivo").value.trim();

      if (motivo.length < 10) {
        err.textContent = "Escreva um motivo maior (mínimo 10 caracteres).";
        return;
      }

      const res = DevSystem.submitDevApplication({ tipo, portfolio, motivo });
      if (!res.ok) {
        err.textContent = res.message || "Falha ao enviar.";
        return;
      }

      alert("Pedido enviado! Agora aguarde aprovação.");
      window.location.href = "./usuario.html";
    });
  </script>

  <!-- MENU + CONTROLE DE ACESSO -->
  <script type="module" src="../js/menu-auth.js"></script>
  <script type="module" src="../js/access.js"></script>
</body>
</html>
