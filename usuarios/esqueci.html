<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esqueci a senha | GameHub Indie</title>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">

  <style>
    body.auth-page{
      min-height: 100vh;
      background: radial-gradient(900px 500px at 20% 10%, rgba(124,92,255,.22), transparent 60%),
                  radial-gradient(900px 500px at 80% 90%, rgba(76,175,80,.18), transparent 60%),
                  #0b0f17;
      color: #fff;
      overflow-x: hidden;
    }

    .neo-bg{
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image:
        linear-gradient(rgba(106,166,255,.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(106,166,255,.10) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1), rgba(0,0,0,.1) 60%, transparent 75%);
    }

    .auth-wrap{
      min-height: calc(100vh - 80px);
      display: grid;
      place-items: center;
      padding: 30px 16px 50px;
    }

    .auth-card{
      width: 100%;
      max-width: 520px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 22px 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      position: relative;
      overflow: hidden;
    }
    .auth-card:before{
      content:"";
      position:absolute;
      inset:-2px;
      background: linear-gradient(135deg, rgba(124,92,255,.35), rgba(76,175,80,.20), rgba(106,166,255,.20));
      opacity: .35;
      filter: blur(20px);
      z-index: 0;
    }
    .auth-card > *{ position: relative; z-index: 1; }

    .brand h1{ font-size: 18px; margin-bottom: 6px; }
    .brand p{ font-size: 13px; opacity:.86; line-height:1.4; margin-bottom: 14px; }

    .field{ display:block; margin-bottom: 12px; }
    .field span{ display:block; font-size: 12px; opacity:.85; margin-bottom: 6px; }
    .field input{
      width:100%;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.25);
      color:#fff;
      padding: 12px 12px;
      border-radius: 10px;
      outline:none;
    }
    .field input::placeholder{ color: rgba(255,255,255,.55); }

    .btn{
      width:100%;
      border:none;
      background: linear-gradient(90deg, #4caf50, #6aa6ff);
      color:#000;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight:bold;
      cursor:pointer;
    }

    .row{
      display:flex;
      justify-content: space-between;
      gap: 10px;
      align-items:center;
      font-size: 12px;
      opacity:.92;
      flex-wrap: wrap;
      margin: 10px 0 14px;
    }

    .link{ color:#6aa6ff; text-decoration:none; }
    .link:hover{ text-decoration: underline; }

    .error{ color:#ff6b6b; font-size: 12px; min-height: 16px; display:block; }
    .ok{ color:#6be870; font-size: 12px; min-height: 16px; display:block; }

    .note{
      margin-top: 10px;
      font-size: 12px;
      opacity: .85;
      line-height: 1.4;
      border-left: 3px solid rgba(106,166,255,.6);
      padding-left: 10px;
    }
  </style>
</head>

<body class="auth-page">
  <div class="neo-bg"></div>

  <header>
    <h2>GameHub Indie</h2>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../catalogo.html">Jogos</a>
      <a href="../sobre.html">Sobre</a>
    </nav>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <div class="brand">
        <h1>Esqueci minha senha</h1>
        <p>Reset simples (DEMO): altera a senha direto no navegador (localStorage).</p>
      </div>

      <form id="resetForm" novalidate autocomplete="on">
        <label class="field">
          <span>Email da conta</span>
          <input id="email" type="email" placeholder="seuemail@gmail.com" autocomplete="email" />
          <small class="error" id="emailError"></small>
        </label>

        <label class="field">
          <span>Nova senha</span>
          <input id="senha" type="password" placeholder="Nova senha (mín. 4)" autocomplete="new-password" />
          <small class="error" id="senhaError"></small>
        </label>

        <label class="field">
          <span>Confirmar nova senha</span>
          <input id="confirmar" type="password" placeholder="Repita a nova senha" autocomplete="new-password" />
          <small class="error" id="confirmarError"></small>
        </label>

        <button class="btn" type="submit">Atualizar senha</button>

        <div class="row">
          <a class="link" href="./login.html">← Voltar para Login</a>
          <a class="link" href="./cadastro.html">Criar conta</a>
        </div>

        <small class="ok" id="okMsg"></small>

        <div class="note">
          <strong>Importante:</strong> isso é somente para testes. Em produção, o ideal é reset por email (Firebase/Supabase/Backend).
        </div>
      </form>
    </section>
  </main>

  <script type="module">
    import { Auth } from "./auth.js";

    const form = document.getElementById("resetForm");
    const email = document.getElementById("email");
    const senha = document.getElementById("senha");
    const confirmar = document.getElementById("confirmar");

    const emailError = document.getElementById("emailError");
    const senhaError = document.getElementById("senhaError");
    const confirmarError = document.getElementById("confirmarError");
    const okMsg = document.getElementById("okMsg");

    function clearMsgs(){
      emailError.textContent = "";
      senhaError.textContent = "";
      confirmarError.textContent = "";
      okMsg.textContent = "";
    }

    // Preenche email salvo (se existir)
    const saved = Auth.getSavedEmail();
    if (saved) email.value = saved;

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      clearMsgs();

      const em = (email.value || "").trim().toLowerCase();
      const pw = (senha.value || "").trim();
      const pw2 = (confirmar.value || "").trim();

      let ok = true;

      if (!em || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) {
        emailError.textContent = "Digite um email válido.";
        ok = false;
      }

      if (pw.length < 4) {
        senhaError.textContent = "Senha inválida (mín. 4).";
        ok = false;
      }

      if (pw2 !== pw) {
        confirmarError.textContent = "As senhas não coincidem.";
        ok = false;
      }

      if (!ok) return;

      // ===== Reset simples (DEMO) =====
      const users = Auth.getUsers();
      const idx = users.findIndex(u => (u.email || "").toLowerCase() === em);

      if (idx === -1) {
        emailError.textContent = "Não encontramos conta com esse email.";
        return;
      }

      users[idx].senha = pw; // DEMO: em produção não salvar senha assim
      Auth.saveUsers(users);

      okMsg.textContent = "Senha atualizada! Agora você pode entrar no login.";
      setTimeout(() => {
        window.location.href = "./login.html";
      }, 900);
    });
  </script>

  <!-- MENU + CONTROLE DE ACESSO -->
  <script type="module" src="../js/menu-auth.js"></script>
  <script type="module" src="../js/access.js"></script>
</body>
</html>
